name: Docker Build and Push

# Scope concurrency per ref so a release-tag publish never queues behind (or gets
# cancelled by) a main-branch build. PR builds cancel superseded runs to save CI.
# Main and tag publishes are never cancelled mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  schedule:
    # Weekly, Mondays at 04:23 UTC. A day-of-month step ('*/7') fires on the 1st,
    # 8th, 15th, 22nd and 29th, so the gap over a month boundary is two or three
    # days and February skips the 29th entirely, which is not the weekly cadence
    # the beta job below describes.
    - cron: '23 4 * * 1'
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - README.md
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/backblaze-personal-wine

jobs:
  # Everything that can be checked without building an image. This job exists for
  # the sanitiser: a bug there crashes nothing and publishes someone's file names,
  # auth token or encryption keys in a bundle meant for a public issue tracker. The rest joined it because nothing in this repo is
  # compiled, so a syntax error or a broken scope check builds, publishes, and is
  # only found by whoever is running the container. Pure Python and shell, so it all
  # gates in seconds rather than waiting on an image build.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The suites need the same Python as the image (3.12) and, for the parse
      # gate's node --check, a node on PATH. ubuntu-latest carries both. This step
      # checks for them, so a runner image change fails here with a clear message.
      - name: Check the runner has what the suites need
        run: |
          set -eu
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python3 --version
          command -v node >/dev/null && node --version

      # First, because a syntax error makes every result below it meaningless.
      - name: Parse every script in both rootfs trees
        run: sh tests/test-parse.sh
      - name: Test the diagnostic bundle sanitiser
        run: python3 tests/test-sanitiser.py
      - name: Test stall detection fails safe
        run: bash tests/test-health.sh
      - name: Test the doctor's lock repair gate
        run: bash tests/test-doctor.sh
      - name: Test the watchdog starts a service that stays down
        run: bash tests/test-watchdog.sh
      - name: Test the Wine patch switches and their interlocks
        run: bash tests/test-switches.sh
      # The web interface: key scopes, the file-name gate on /api/v1, the settings
      # whitelist, the log parsers, quiet hours, notifications and the Wine switches.
      - name: Test the web interface, API and notifications
        run: python3 tests/test-beta.py

  build:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # ubuntu24 is the default (oldest supported LTS). The shared :latest/:main/
        # version tags track it for stability. ubuntu26 ships as :ubuntu26 for early
        # validation before it becomes the default. When 24.04's support ends, drop
        # its entry here and let the default fall through to the next-oldest LTS.
        dockerfile: [ubuntu24, ubuntu26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No QEMU step: every build here is platforms: linux/amd64, which is the
      # runner's architecture, and emulation is only needed to build for
      # another one. There is no linux/arm64 image because the client is a 64-bit
      # Windows binary under Wine. The README explains why that is not a matrix entry.
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Each variant always gets its own :ubuntuNN tag. The shared, unsuffixed
          # tags (:latest, :main, the version tag) belong to the DEFAULT variant
          # only - the oldest supported LTS (ubuntu24) - so they stay stable and the
          # two matrix jobs never clobber each other's tags. :latest only moves on a
          # release-tag push. The newer LTS is reachable via :ubuntu26 (and
          # :<version>-ubuntu26 on releases) for early validation.
          tags: |
            type=raw,value=${{ matrix.dockerfile }}
            type=ref,event=tag,enable=${{ matrix.dockerfile == 'ubuntu24' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && matrix.dockerfile == 'ubuntu24' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && matrix.dockerfile == 'ubuntu24' }}
            type=ref,event=tag,suffix=-ubuntu26,enable=${{ matrix.dockerfile == 'ubuntu26' }}

      # Set up cache
      - name: Setup Docker build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.dockerfile }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.dockerfile }}-

      # Build the image locally first so it can be started and checked before any
      # push. A successful build does not show that the container comes up. Base
      # image updates and startup script changes have broken first boot while
      # building cleanly.
      - name: Build Docker image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.${{ matrix.dockerfile }}
          build-args: |
            BUILD_REV=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          load: true
          tags: bb-smoketest:${{ matrix.dockerfile }}
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Smoke test the built image
        run: ./.github/smoke-test.sh bb-smoketest:${{ matrix.dockerfile }}

      # The stable images must never carry the patched Wine. They install
      # winehq-stable from apt and reference nothing in patches/, so today this
      # holds by construction - this step keeps it holding. The beta's Wine
      # workaround diverges from Windows on purpose and is beta-only. A stable
      # image that picked it up would be shipping that divergence to users who
      # never opted into it.
      - name: Assert the stable image carries unpatched Wine
        run: |
          set -eu
          docker run --rm --entrypoint sh bb-smoketest:${{ matrix.dockerfile }} -c '
            ws="$(readlink -f "$(command -v wineserver)")"
            if grep -qa sock_stream_send_ready "$ws"; then
              echo "FAIL: $ws contains the beta Wine patch; it must stay beta-only" >&2
              exit 1
            fi
            echo "OK: $ws is unpatched"
          '

      # Push only once the smoke test has passed (and never on a pull request).
      # The layers are already in the cache the test build populated, so this step
      # assembles and pushes rather than rebuilding.
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.${{ matrix.dockerfile }}
          build-args: |
            DOCKER_IMAGE_VERSION=${{ steps.meta.outputs.version }}
            BUILD_REV=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

  # The beta image: Ubuntu 26.04 with Wine built from source and the upload-speed
  # patch applied. Compiling Wine takes much longer than the stable images, so this
  # runs on the weekly schedule and on demand rather than on every push. The build
  # cache keys on the Dockerfile and the patch, so repeat runs are fast until one
  # of those changes.
  #
  # It publishes only the :beta tag. The stable tags come from the build
  # job above. The guard below fails the job rather than let a mistake in the tag
  # list overwrite :latest for every user.
  beta:
    needs: tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: /tmp/.buildx-cache-beta
          key: ${{ runner.os }}-buildx-beta-${{ hashFiles('Dockerfile.beta', 'patches/*') }}
          restore-keys: |
            ${{ runner.os }}-buildx-beta-

      - name: Build the beta image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.beta
          build-args: |
            DOCKER_IMAGE_VERSION=beta
            BUILD_REV=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          load: true
          tags: bb-beta-test:local
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache-beta
          cache-to: type=local,dest=/tmp/.buildx-cache-beta,mode=max

      - name: Smoke test the beta image
        run: ./.github/smoke-test.sh bb-beta-test:local

      - name: Check the beta carries the patched Wine
        run: |
          set -eu
          # The stable images install winehq-stable into /usr. Only the beta builds
          # Wine into /opt/wine. If that is missing, the patch is not in the image.
          docker run --rm --entrypoint /opt/wine/bin/wine bb-beta-test:local --version
          docker run --rm --entrypoint sh bb-beta-test:local -c 'grep -q "^variant=beta" /etc/bb-build'
          # Fingerprint the writability patch in the built binary. The build already
          # fails on `git apply --check`, but that only proves the patch applied to the
          # source. This proves the result reached the shipped wineserver.
          docker run --rm --entrypoint sh bb-beta-test:local -c \
            'grep -ac sock_stream_send_ready /opt/wine/bin/wineserver | grep -qv "^0$"'
          # The switches: the build wrote its manifest, the switch reached the
          # binary, and the image turns the fixes and performance patches on.
          # Unset, the patched Wine behaves as upstream, so a beta that lost
          # these defaults would quietly lose its fixes.
          docker run --rm --entrypoint sh bb-beta-test:local -c '
            set -eu
            grep -q "^applied wine-writability-fix switch" /opt/wine/share/bb64-patches
            grep -aq WINE_SOCK_SEND_READY /opt/wine/bin/wineserver
            for v in WINE_SOCK_SEND_READY WINE_SOCK_FDWRITE_REARM WINE_SERVICE_TOKEN WINE_OFD_LOCKS WINE_CASE_CACHE; do
              eval "test \"\${$v:-}\" = 1" || { echo "beta default $v is not 1" >&2; exit 1; }
            done
          '
          # The FD_WRITE re-arm adds no new symbol, so it has no binary fingerprint.
          # Its guard is the `git apply --check` at build time, which fails the build
          # if the context no longer matches.
          # bb-doctor re-runs itself as the container user with setpriv when it is
          # started as root. The build checks the binary is present, and this checks it
          # is still present in the image that ships, and that the patched script
          # parses.
          #
          # bb-doctor sources five drop-ins, and build/finish-image.sh fails the
          # build if any is missing. The five below are the same five, by name, so
          # this stays an independent re-check of the image that ships.
          docker run --rm --entrypoint sh bb-beta-test:local -c '
            set -eu
            command -v setpriv >/dev/null
            sh -n /usr/local/bin/bb-doctor
            for part in asuser skipped drives config passes; do
              grep -q "bb-doctor-$part.sh" /usr/local/bin/bb-doctor
              sh -n "/usr/local/lib/bb-doctor-$part.sh"
            done
            grep -q "swap to absorb the peaks" /usr/local/bin/bb-doctor
            sh -n /usr/local/bin/bb-health
            grep -q FROZEN /usr/local/bin/bb-health
            bash -n /startapp.sh
            grep -q BACKBLAZE_VERSION /startapp.sh
          '

      - name: Push the beta image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.beta
          build-args: |
            DOCKER_IMAGE_VERSION=beta
            BUILD_REV=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta
          cache-from: type=local,src=/tmp/.buildx-cache-beta
          cache-to: type=local,dest=/tmp/.buildx-cache-beta,mode=max

  # :latest-patched. The stable container (Dockerfile.ubuntu24) on the fork's
  # Wine instead of WineHQ's, built with WINE_FLAVOUR=patched from the same
  # patches/build-wine.sh the beta uses, at the WINE_REF that Dockerfile pins.
  # The fixes are on and the performance and experimental patches off. Wine is
  # compiled here, so it runs on release tags (latest-patched and
  # <version>-patched) and on demand or the weekly schedule (main-patched),
  # not on every push. The guard below fails the job rather than let a tag
  # without the -patched suffix overwrite a WineHQ tag.
  patched:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: tags
        run: |
          set -eu
          img="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            ver="${GITHUB_REF#refs/tags/}"
            tags="$img:latest-patched,$img:${ver}-patched"
          else
            ver="main"
            tags="$img:main-patched"
          fi
          for t in $(echo "$tags" | tr ',' ' '); do
            case "$t" in *-patched) ;; *) echo "refusing to publish $t: not a -patched tag" >&2; exit 1 ;; esac
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Setup Docker build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: /tmp/.buildx-cache-patched
          key: ${{ runner.os }}-buildx-patched-${{ hashFiles('Dockerfile.ubuntu24', 'patches/*') }}
          restore-keys: |
            ${{ runner.os }}-buildx-patched-

      - name: Build the patched image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.ubuntu24
          build-args: |
            WINE_FLAVOUR=patched
            DOCKER_IMAGE_VERSION=${{ steps.tags.outputs.version }}
            BUILD_REV=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          load: true
          tags: bb-patched-test:local
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache-patched
          cache-to: type=local,dest=/tmp/.buildx-cache-patched,mode=max

      - name: Smoke test the patched image
        run: ./.github/smoke-test.sh bb-patched-test:local

      - name: Check the patched image carries the fork's Wine with its defaults
        run: |
          set -eu
          docker run --rm --entrypoint /opt/wine/bin/wine bb-patched-test:local --version
          docker run --rm --entrypoint sh bb-patched-test:local -c '
            set -eu
            grep -q "^variant=ubuntu24-patched" /etc/bb-build
            grep -q "^applied wine-writability-fix switch" /opt/wine/share/bb64-patches
            grep -aq WINE_SOCK_SEND_READY /opt/wine/bin/wineserver
            test "$(readlink -f "$(command -v wineserver)")" = /opt/wine/bin/wineserver
            test "$WINE_SOCK_SEND_READY" = 1 && test "$WINE_SERVICE_TOKEN" = 1 && test "$WINE_OFD_LOCKS" = 1
            test "$WINE_SOCK_FDWRITE_REARM" = 0 && test "$WINE_CASE_CACHE" = 0
            test -z "$BACKBLAZE_VERSION"
          '

      - name: Push the patched image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.ubuntu24
          build-args: |
            WINE_FLAVOUR=patched
            DOCKER_IMAGE_VERSION=${{ steps.tags.outputs.version }}
            BUILD_REV=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache-patched
          cache-to: type=local,dest=/tmp/.buildx-cache-patched,mode=max
