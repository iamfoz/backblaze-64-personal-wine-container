# Upload dashboard (bb-monitor-web), proxied from the loopback service.
#
# Included into the base image's server block by a build-time patch to
# default_site.conf. It sits alongside the base's own optional includes
# (vnc.conf, term.conf, fmgr.conf) and follows the same shape.
#
# There is deliberately NO `auth_request off;` here. auth.conf sets
# `auth_request /auth;` at server level, so this location inherits whatever
# WEB_AUTHENTICATION and SECURE_CONNECTION the user has configured for the GUI.
# An exemption would publish the name of every file being backed up to anyone
# who can reach the port. The favicon location in default_site.conf is the only
# thing that legitimately opts out.
location /monitor/ {
    # Trailing slash on both sides: /monitor/api/status reaches the service as
    # /api/status. The page fetches a relative path so it works either way.
    proxy_pass http://127.0.0.1:8099/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    # The page polls every 2s and the payload is small. Buffering adds latency
    # to a live view for no benefit.
    proxy_buffering off;

    # The service is on loopback in the same container, so a slow response means
    # it is wedged rather than far away. Fail fast instead of holding the worker.
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# Bare /monitor without the slash would otherwise 404 rather than reach the app.
location = /monitor {
    absolute_redirect off;
    return 302 /monitor/;
}

# noVNC served from a directory path, for the desktop tab to frame.
#
# It must be a path ending in a slash. noVNC builds its websocket URL by
# appending "websockify" to location.pathname, so from /index.html it asks for
# /index.htmlwebsockify, which matches neither the websockify handler nor
# anything else, and the viewer sits on "connecting" forever. From /desktop/ it
# asks for /desktop/websockify, which the base image's `location ~ /websockify$`
# matches. A regex location beats a prefix one in nginx, so that request reaches
# websockify rather than this alias.
location /desktop/ {
    alias /opt/noVNC/;
    index index.html;
}

# The tabbed shell, so the WebUI button lands somewhere that offers both the Wine
# desktop and the monitor rather than only the desktop.
#
# An exact-match location beats the server block's own `root /opt/noVNC; index
# index.html`, so this takes over "/" while leaving /index.html reachable, which
# is what the shell's desktop tab points its iframe at. That also means the
# desktop is still directly usable at /index.html if the shell is ever the thing
# that breaks.
#
# No `auth_request off` here either: auth.conf sets it at server level and the
# shell inherits it, so the login prompt appears before either tab is reachable.
location = / {
    root /opt/bb-shell;
    try_files /index.html =404;
}
