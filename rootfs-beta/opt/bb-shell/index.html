<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backblaze 64</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* Plain and thin. The desktop and the monitor each have their own look, and
     the monitor has thirteen themes. A styled shell would clash with whichever
     one is picked. */
  :root{ --bar:#0e2148; --bar-fg:#d7e6ff; --accent:#39c5ff; --edge:#1c3a63; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#0a1830;}
  body{display:flex;flex-direction:column;
       font-family:"Cascadia Mono","Consolas","Menlo",monospace;font-size:13px;}
  /* The tab row scrolls sideways when it does not fit. A
     finger swipes it natively; a mouse drags it (below); and the fades at either
     edge, with a chevron, say that there is more. Without them a phone showed
     five tabs and no sign of the sixth. */
  #tabwrap{position:relative;flex:0 0 auto;background:var(--bar);}
  #tabs{display:flex;align-items:stretch;background:var(--bar);color:var(--bar-fg);
        border-bottom:1px solid var(--edge);overflow-x:auto;overflow-y:hidden;
        scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  #tabs::-webkit-scrollbar{display:none;}
  #tabs.dragging{cursor:grabbing;user-select:none;}
  #tabs button{appearance:none;background:transparent;border:0;flex:0 0 auto;white-space:nowrap;
        border-bottom:2px solid transparent;color:var(--bar-fg);font:inherit;
        font-weight:bold;padding:7px 18px;cursor:pointer;opacity:.6;
        transition:opacity .15s,border-color .15s;}
  #tabwrap::before,#tabwrap::after{content:'';position:absolute;top:0;bottom:1px;width:34px;
        pointer-events:none;opacity:0;transition:opacity .15s;display:flex;align-items:center;
        color:var(--accent);font-size:20px;line-height:1;}
  #tabwrap::before{left:0;content:'\2039';justify-content:flex-start;padding-left:4px;
        background:linear-gradient(to right,var(--bar) 45%,rgba(14,33,72,0));}
  #tabwrap::after{right:0;content:'\203A';justify-content:flex-end;padding-right:4px;
        background:linear-gradient(to left,var(--bar) 45%,rgba(14,33,72,0));}
  #tabwrap.more-left::before,#tabwrap.more-right::after{opacity:1;}
  #tabs button:hover{opacity:.9;}
  #tabs button[aria-selected="true"]{opacity:1;color:var(--accent);
        border-bottom-color:var(--accent);}
  #brand{margin-left:auto;display:flex;align-items:center;padding:0 12px;
        opacity:.45;font-weight:bold;letter-spacing:.02em;}
  .pane{flex:1 1 auto;border:0;width:100%;display:block;background:#0a1830;}
  .pane[hidden]{display:none;}
  #fallback{padding:14px;color:#ff5a5a;}
  /* Shown over the desktop pane when noVNC reports it has lost the connection,
     which after a container restart is otherwise a blank pane with nothing to
     click. One line and one button. */
  #desk-notice{display:flex;gap:12px;align-items:center;padding:8px 12px;
    background:#3a1a1a;color:#ffd7d7;border-bottom:1px solid #6b2b2b;font-size:13px;}
  #desk-notice[hidden]{display:none;}
  #desk-notice button{appearance:none;border:1px solid #ffb3b3;background:transparent;color:#ffd7d7;
    padding:4px 10px;border-radius:4px;font:inherit;cursor:pointer;}
  /* On a phone the tabs should own the width and be comfortably tappable.
     44px is the usual floor for a finger target. The default padding gives
     about 30. */
  @media (max-width:560px){
    #brand{display:none;}
    #tabs button{padding:12px 14px;min-height:44px;}
  }
</style>
</head>
<body>
<div id="tabwrap">
<div id="tabs" role="tablist">
  <button role="tab" data-pane="desktop" aria-controls="pane-desktop" aria-selected="true">Desktop</button>
  <button role="tab" data-pane="monitor" aria-controls="pane-monitor" aria-selected="false">Monitor</button>
  <button role="tab" data-pane="status" aria-controls="pane-status" aria-selected="false">Status</button>
  <button role="tab" data-pane="tools" aria-controls="pane-tools" aria-selected="false">Tools</button>
  <button role="tab" data-pane="api" aria-controls="pane-api" aria-selected="false">API</button>
  <button role="tab" data-pane="settings" aria-controls="pane-settings" aria-selected="false">Settings</button>
  <span id="brand">Backblaze 64</span>
</div>
</div>

<!-- /desktop/ rather than /index.html. noVNC appends "websockify" to
     location.pathname to build its websocket URL, so serving it from a file path
     produces /index.htmlwebsockify and the viewer never connects. A directory
     path gives /desktop/websockify, which nginx routes correctly.

     The iframe is created once and only ever hidden, never removed and never
     re-pointed. Tearing it down would drop the VNC session and the Wine desktop
     would reconnect from scratch every time someone glanced at the monitor. -->
<div id="desk-notice" hidden role="status">Desktop disconnected.
  <button id="desk-reconnect" type="button">Reconnect</button></div>
<iframe id="pane-desktop" class="pane" role="tabpanel" src="/desktop/"
        allow="fullscreen; clipboard-read; clipboard-write"
        title="Wine desktop"></iframe>

<!-- The monitor is loaded lazily. Its page polls every two seconds, so there is
     no reason to start that before anyone has asked to see it. -->
<iframe id="pane-monitor" class="pane" role="tabpanel" hidden
        title="Upload monitor"></iframe>

<!-- Everything the client says needs attention, and the files it has given up
     on. Also lazy, and also served through /monitor/ so it inherits the login.
     This pane lists paths on the user's share, which must not be readable
     without one. -->
<iframe id="pane-status" class="pane" role="tabpanel" hidden
        title="Status"></iframe>

<!-- The command-line tools, run from the page. Lazy, and behind the login for
     the same reason. bb-doctor prints directory paths, and a repair button must
     not be reachable without one. -->
<iframe id="pane-tools" class="pane" role="tabpanel" hidden
        title="Tools"></iframe>

<!-- Key management. Served through /monitor/ so it inherits the same login as
     the dashboard. Creating a key must never sit on the exempted /api/v1/ path. -->
<iframe id="pane-api" class="pane" role="tabpanel" hidden
        title="API keys"></iframe>

<!-- Notifications and quiet hours. Configuration, so a tab separate from the
     API page. Behind the login because tokens are typed here. -->
<iframe id="pane-settings" class="pane" role="tabpanel" hidden
        title="Settings"></iframe>

<script>
(function(){
  var MON = '/monitor/';
  var STATUS = '/monitor/status';
  var TOOLS = '/monitor/tools';
  var API = '/monitor/apikeys';
  var SETTINGS = '/monitor/settings';
  var ORDER = ['desktop', 'monitor', 'status', 'tools', 'api', 'settings'];   // the digit keys, in tab order
  var tabs = Array.prototype.slice.call(document.querySelectorAll('#tabs button'));
  var panes = { desktop: document.getElementById('pane-desktop'),
                monitor: document.getElementById('pane-monitor'),
                status: document.getElementById('pane-status'),
                tools: document.getElementById('pane-tools'),
                api: document.getElementById('pane-api'),
                settings: document.getElementById('pane-settings') };
  var loaded = { desktop: true, monitor: false, status: false, tools: false, api: false, settings: false };
  var SRC = { monitor: MON, status: STATUS, tools: TOOLS, api: API, settings: SETTINGS };

  function show(name){
    if(name === 'skipped') name = 'status';   // the tab's old name, in saved state and old links
    if(!panes[name]) name = 'desktop';
    if(SRC[name] && !loaded[name]){
      panes[name].src = SRC[name];  // first activation only
      loaded[name] = true;
    }
    tabs.forEach(function(t){
      var on = t.getAttribute('data-pane') === name;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      panes[t.getAttribute('data-pane')].hidden = !on;
      // The chosen tab is brought into view, so a saved or linked tab that sits
      // off the end of a narrow bar is never selected out of sight.
      if(on && t.scrollIntoView) try { t.scrollIntoView({inline:'nearest', block:'nearest'}); } catch(e){}
    });
    try { localStorage.setItem('bbShellTab', name); } catch(e){}
    // Keep the address bar matching the tab without reloading, so a refresh or
    // a shared link lands on the same tab.
    try { history.replaceState(null, '', name === 'desktop' ? '/' : '/?tab=' + name); } catch(e){}
  }

  var dragged = false;
  tabs.forEach(function(t){
    t.addEventListener('click', function(){ if(!dragged) show(t.getAttribute('data-pane')); });
  });

  // Edge fades: on whenever there is more bar in that direction.
  var bar = document.getElementById('tabs'), wrap = document.getElementById('tabwrap');
  function edges(){
    var max = bar.scrollWidth - bar.clientWidth;
    wrap.classList.toggle('more-left', bar.scrollLeft > 2);
    wrap.classList.toggle('more-right', max - bar.scrollLeft > 2);
  }
  bar.addEventListener('scroll', edges);
  window.addEventListener('resize', edges);
  edges();

  // Click and drag with a mouse. Touch already scrolls the bar on its own, so
  // this only takes over for a mouse pointer, and a drag of more than a few
  // pixels swallows the click that would otherwise land on a tab.
  var drag = null;
  bar.addEventListener('pointerdown', function(e){
    if(e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = {x: e.clientX, left: bar.scrollLeft}; dragged = false;
  });
  bar.addEventListener('pointermove', function(e){
    if(!drag) return;
    var dx = e.clientX - drag.x;
    if(Math.abs(dx) > 4){ dragged = true; bar.classList.add('dragging'); bar.scrollLeft = drag.left - dx; }
  });
  function endDrag(){ if(!drag) return; drag = null; bar.classList.remove('dragging'); setTimeout(function(){ dragged = false; }, 0); }
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', endDrag);
  bar.addEventListener('pointerleave', endDrag);

  var params = new URLSearchParams(location.search);
  var q = params.get('tab');
  // A link from the Status tab can ask the Tools tab to do something on
  // arrival, for example start a diagnostic bundle. Passed through once.
  var run = params.get('run');
  if(q === 'tools' && run && /^[a-z]+$/.test(run)) SRC.tools = TOOLS + '?run=' + run;
  var saved = null;
  try { saved = localStorage.getItem('bbShellTab'); } catch(e){}
  show(q || saved || 'desktop');

  // Digits switch tabs, here and from inside any frame that forwards them.
  document.addEventListener('keydown', function(e){
    var tg = e.target && e.target.tagName;
    if(tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key >= '1' && e.key <= '6') show(ORDER[Number(e.key) - 1]);
  });
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin) return;
    var m = e.data;
    if(m && m.bb64 === 'tab' && m.n >= 1 && m.n <= 6) show(ORDER[m.n - 1]);
    // The Settings tab asks for the Monitor's settings. Show the Monitor, then
    // tell its frame. On the first visit the frame is still loading, so the
    // message waits for its load event.
    if(m && m.bb64 === 'monitor-settings'){
      var wasLoaded = loaded.monitor;
      show('monitor');
      var send = function(){ try { panes.monitor.contentWindow.postMessage(
        {bb64: 'open-settings', section: 'status'}, location.origin); } catch(e){} };
      if(wasLoaded) send(); else panes.monitor.addEventListener('load', send, {once: true});
    }
  });

  // The tab title carries the state, because the browser tab stays visible
  // while the user is doing something else. Polled lightly from the small
  // status feed instead of the Monitor's full one.
  function title(){
    fetch('/monitor/manage/status', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      var mark = '';
      if(j.health && j.health.length) mark = '! ';
      else if(j.paused) mark = '\u275A\u275A ';
      else if(j.state === 'Transmitting' || j.state === 'Uploading') mark = '\u25CF ';
      document.title = mark + 'Backblaze 64';
    }).catch(function(){});
  }
  title(); setInterval(title, 20000);

  // The desktop pane looks after itself. noVNC's status text is read from the
  // frame (same origin) and, when it reports the connection gone, a notice with
  // a Reconnect button appears. Anything unexpected in that document leaves the
  // notice hidden.
  var notice = document.getElementById('desk-notice');
  function checkDesktop(){
    try {
      var doc = panes.desktop.contentDocument;
      var txt = doc && doc.body ? (doc.body.innerText || '') : '';
      notice.hidden = !/disconnected|failed to connect|connection closed|connection error/i.test(txt);
    } catch(e){ notice.hidden = true; }
  }
  document.getElementById('desk-reconnect').addEventListener('click', function(){
    notice.hidden = true;
    panes.desktop.src = '/desktop/';    // re-pointed only here, because the session is already gone
  });
  setInterval(checkDesktop, 20000);
})();
</script>
</body></html>
